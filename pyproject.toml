[project]
name = "itemtree-era-sources"
version = "0.2.0"
description = "Corresponding Source for the GPL-3.0 files of the ItemTree and Jettison World of Warcraft addons (EraSources.lua, BossLoot.lua, EraFacts.lua): the Classic Era writers and their pinned inputs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "third_party/**/*"]
authors = [{ name = "Rockjaw Bonesnapper Co" }]
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["itemtree_era_sources"]
