[project]
name = "itemtree-era-sources"
version = "0.1.0"
description = "Corresponding Source for the EraSources.lua module of the ItemTree World of Warcraft addon: the compiler and its pinned inputs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "third_party/**/*"]
authors = [{ name = "Rockjaw Bonesnapper Co" }]
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["itemtree_era_sources"]
